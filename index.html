<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Something was left here for you.">
  <meta name="theme-color" content="#160d1e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>JANA</title>

  <!-- Preconnect to Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=Inter:wght@300;400;500;600&family=Dancing+Script:wght@400;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css?v=18">
</head>
<body>

  <!-- Film grain overlay -->
  <div class="grain" id="grain" aria-hidden="true"></div>

  <!-- Ambient particle field -->
  <canvas class="particles" id="particles" aria-hidden="true"></canvas>

  <!-- Audio toggle -->
  <button class="audio-btn" id="audio-btn" aria-label="Toggle ambient sound">
    <span id="audio-icon">♪</span>
  </button>

  <!-- Progress indicator -->
  <div class="progress-bar" id="progress-bar" aria-hidden="true">
    <div class="progress-fill" id="progress-fill"></div>
  </div>

  <!-- Main chapter container -->
  <main id="app">
    <div id="chapter" class="chapter-container"></div>
  </main>

  <!-- Curtain transition overlay -->
  <div class="curtain" id="curtain" aria-hidden="true"></div>

  <!-- Photo lightbox -->
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer">
    <button class="lightbox-close" id="lightbox-close" aria-label="Close">✕</button>
    <div class="lightbox-inner">
      <img class="lightbox-img" id="lightbox-img" alt="">
      <p class="lightbox-caption" id="lightbox-caption"></p>
    </div>
  </div>

  <!-- Toast notification -->
  <div class="toast" id="toast" role="alert" aria-live="polite"></div>

  <!-- Entry point -->
  <script type="module" src="main.js?v=18"></script>
</body>
</html>
